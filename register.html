<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | Mental Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><div class="auth-shell"><div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-leaf"></i></span><span>Mental <strong>Go</strong></span></a></div><div class="auth-card"><div class="auth-heading"><span class="eyebrow">CREATE YOUR SPACE</span><h1>Start your Mental Go journey.</h1><p>Create an account so your dashboard can be personal to you.</p></div><form id="registerForm"><label>Full name<input id="registerName" type="text" required placeholder="Your name"></label><label>Email address<input id="registerEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="registerPassword" type="password" required minlength="6" placeholder="At least 6 characters"></label><label>Confirm password<input id="registerConfirm" type="password" required minlength="6" placeholder="Repeat your password"></label><p class="auth-message" id="registerMessage"></p><button class="btn btn-primary auth-submit" type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p><a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Mental Go</a></div></div><script src="js/app.js"></script></body></html>

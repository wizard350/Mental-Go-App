<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Mental Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body class="auth-page">
<div class="auth-shell"><div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-leaf"></i></span><span>Mental <strong>Go</strong></span></a></div>
<div class="auth-card"><div class="auth-heading"><span class="eyebrow">WELCOME BACK</span><h1>Log in to your wellness space.</h1><p>Continue your personal check-ins, journal, habits and activities.</p></div>
<form id="loginForm"><label>Email address<input id="loginEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="loginPassword" type="password" required minlength="6" placeholder="Enter your password"></label><p class="auth-message" id="loginMessage"></p><button class="btn btn-primary auth-submit" type="submit">Log in <i class="fa-solid fa-arrow-right"></i></button></form>
<p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p><a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Mental Go</a></div>
</div><script src="js/app.js"></script></body></html>
